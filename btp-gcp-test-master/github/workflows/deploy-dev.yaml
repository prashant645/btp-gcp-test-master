name: Deploy – dev

on:
  push:
    branches:
      - develop
      - 'testing/**'
  workflow_dispatch:

# Never cancel a running deploy: stopping e2e or rollback halfway could leave a broken version live.
concurrency:
  group: btp-gcp-test-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/wf-deploy-e2e.yaml
    with:
      deploy_env: dev
      namespace: default
    secrets:
      GCP_KUBECONFIG_B64: ${{ secrets.GCP_KUBECONFIG_B64 }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
