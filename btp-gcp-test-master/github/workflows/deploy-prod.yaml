name: Deploy – prod

on:
  push:
    branches:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-hotfix.[0-9]*'
  workflow_dispatch:

concurrency:
  group: btp-gcp-test-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: gtlc-production.common.repositories.cloud.sap
  QA_IMAGE: gtlc-production.common.repositories.cloud.sap/btp-gcp-test-qa
  IMAGE: gtlc-production.common.repositories.cloud.sap/btp-gcp-test-prod
  NAMESPACE: demoapp-prod
  HELM_RELEASE: hello-world

jobs:
  # Before the approval step, so nobody is asked to approve a commit that failed QA.
  qa_gate:
    name: QA passed for this commit
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check QA run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-qa-passed.sh

  deploy:
    name: Deploy
    needs: qa_gate
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check for unfilled placeholders
        run: bash scripts/check-env-placeholders.sh helm/demoapp/values-prod.yaml

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      # The same image QA tested, not a rebuild. rel.* and v* share a commit, so the tag matches.
      - name: Copy the QA image to prod
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$QA_IMAGE:$GITHUB_SHA"

      - name: Configure Kubernetes
        env:
          KYMA_KUBECONFIG_B64: ${{ secrets.GCP_KUBECONFIG_B64 }}
          KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig
        run: bash scripts/setup-kyma-tools.sh

      - name: Deploy
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry hello-world-registry \
            --docker-server="$REGISTRY" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install "$HELM_RELEASE" helm/demoapp \
            -n "$NAMESPACE" \
            --values helm/demoapp/values-prod.yaml \
            --set image.tag="$GITHUB_SHA" \
            --atomic \
            --timeout 5m

      - name: Wait for APIRule
        run: bash scripts/wait-apirule-ready.sh "$NAMESPACE" "$HELM_RELEASE"

      - name: Smoke test
        run: |
          HOST="$(yq '.apirule.host' helm/demoapp/values-prod.yaml)"
          bash scripts/smoke-test.sh "$HOST"
