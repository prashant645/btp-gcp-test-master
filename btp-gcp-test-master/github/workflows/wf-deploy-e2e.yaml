# Shared by dev and qa: build and test, deploy, verify, then roll back if verification fails.
name: Deploy, e2e, rollback

on:
  workflow_call:
    inputs:
      deploy_env:
        description: dev or qa
        type: string
        required: true
      namespace:
        type: string
        required: true
    secrets:
      GCP_KUBECONFIG_B64:
        required: true
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

env:
  REGISTRY: gtlc-production.common.repositories.cloud.sap
  IMAGE: gtlc-production.common.repositories.cloud.sap/btp-gcp-test-${{ inputs.deploy_env }}
  CHART_REPO: gtlc-production.common.repositories.cloud.sap/btp-gcp-test-charts
  NAMESPACE: ${{ inputs.namespace }}
  HELM_RELEASE: hello-world
  VALUES_FILE: helm/demoapp/values-${{ inputs.deploy_env }}.yaml

jobs:
  build_test:
    name: Build & Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - name: Check for unfilled placeholders
        run: bash scripts/check-env-placeholders.sh "$VALUES_FILE"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # Publish the chart for this commit next to its image, as <chart version>-<commit>.
      # Deploys still install from the repo; a failed publish stops the run before deploy.
      - name: Publish Helm chart
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v helm >/dev/null 2>&1; then
            mkdir -p "$HOME/bin" && export PATH="$HOME/bin:$PATH"
            curl -fsSL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz | tar -xz -C /tmp linux-amd64/helm
            mv /tmp/linux-amd64/helm "$HOME/bin/helm"
          fi
          version="$(awk '/^version:/ {print $2}' helm/demoapp/Chart.yaml)-${GITHUB_SHA}"
          helm package helm/demoapp --version "$version" --app-version "$GITHUB_SHA" -d "$RUNNER_TEMP"
          echo "$REGISTRY_PASSWORD" | helm registry login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          helm push "$RUNNER_TEMP/demoapp-${version}.tgz" "oci://${CHART_REPO}"
          echo "Published oci://${CHART_REPO}/demoapp:${version}"

  deploy:
    name: Deploy
    needs: build_test
    runs-on: self-hosted
    outputs:
      previous_revision: ${{ steps.previous.outputs.revision }}
      previous_version: ${{ steps.previous.outputs.version }}
      host: ${{ steps.host.outputs.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        env:
          KYMA_KUBECONFIG_B64: ${{ secrets.GCP_KUBECONFIG_B64 }}
          KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig
        run: bash scripts/setup-kyma-tools.sh

      - name: Read host
        id: host
        run: echo "host=$(yq '.apirule.host' "$VALUES_FILE")" >> "$GITHUB_OUTPUT"

      - name: Record the live release
        id: previous
        run: |
          bash scripts/rollback-release.sh record "$NAMESPACE" "$HELM_RELEASE" | tee -a "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry hello-world-registry \
            --docker-server="$REGISTRY" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install "$HELM_RELEASE" helm/demoapp \
            -n "$NAMESPACE" \
            --values "$VALUES_FILE" \
            --set image.tag="$GITHUB_SHA" \
            --atomic \
            --timeout 3m

  smoke:
    name: APIRule + smoke
    needs: deploy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        env:
          KYMA_KUBECONFIG_B64: ${{ secrets.GCP_KUBECONFIG_B64 }}
          KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig
        run: bash scripts/setup-kyma-tools.sh

      - name: Wait for APIRule
        run: bash scripts/wait-apirule-ready.sh "$NAMESPACE" "$HELM_RELEASE"

      - name: Smoke test
        env:
          HOST: ${{ needs.deploy.outputs.host }}
        run: bash scripts/smoke-test.sh "$HOST"

  e2e:
    name: e2e
    needs: smoke
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run e2e
        env:
          DEPLOY_ENV: ${{ inputs.deploy_env }}
        run: bash scripts/runTest.sh -e "$DEPLOY_ENV" -v "$GITHUB_SHA"

      - name: Upload results
        if: always()
        continue-on-error: true  # a failed upload must not trigger a rollback
        uses: actions/upload-artifact@v3
        with:
          name: e2e-results-${{ inputs.deploy_env }}
          path: e2e/results/
          retention-days: 14

  # Runs only after a successful upgrade; --atomic has already reverted a failed one.
  # The run stays red after a rollback, so the release gate treats it as failed.
  rollback:
    name: Rollback
    needs: [deploy, smoke, e2e]
    if: failure() && needs.deploy.result == 'success'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure Kubernetes
        env:
          KYMA_KUBECONFIG_B64: ${{ secrets.GCP_KUBECONFIG_B64 }}
          KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig
        run: bash scripts/setup-kyma-tools.sh

      - name: Roll back and check the old version
        env:
          REVISION: ${{ needs.deploy.outputs.previous_revision }}
          VERSION: ${{ needs.deploy.outputs.previous_version }}
          HOST: ${{ needs.deploy.outputs.host }}
        run: bash scripts/rollback-release.sh restore "$NAMESPACE" "$HELM_RELEASE" "$REVISION" "$VERSION" "$HOST"
